<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>出席受付</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{--navy:#173b63;--blue:#1769aa;--bg:#f4f7fa;--text:#15202b;--muted:#5d6b78;--line:#d8e0e8;--ok:#147c4b;--error:#b3261e}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    main{max-width:560px;min-height:100vh;margin:auto;padding:26px 18px 48px;background:#fff} h1{font-size:24px;margin:0 0 8px;color:var(--navy)} h2{font-size:19px;margin:0 0 12px} p{line-height:1.7} .lead,.hint{color:var(--muted)} .card{margin-top:22px;padding:20px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 2px 10px #183b6310}
    label{display:block;margin:16px 0 6px;font-weight:700} input{width:100%;padding:14px;border:1.5px solid #aebdca;border-radius:9px;font-size:17px} button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;cursor:pointer} button:disabled{background:#91a4b5;cursor:wait} button.sub{background:#fff;border:1.5px solid var(--blue);color:var(--blue)}
    .candidate{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:9px;padding:14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);text-align:left;font-size:16px}.candidate small{color:var(--muted)} .notice{padding:14px;border-radius:9px;background:#edf7f1;color:#125c3a;line-height:1.7}.error{padding:14px;border-radius:9px;background:#fff0ef;color:var(--error);line-height:1.7}.hidden{display:none!important}.center{text-align:center}.mark{font-size:52px;line-height:1;margin:8px 0 18px}.name{font-size:22px;font-weight:700}.foot{margin-top:26px;font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
<main>
  <h1>出席受付</h1>
  <p class="lead">受付内容を確認して、「出席する」を押してください。</p>

  <section id="loading" class="card center"><p>LINEの情報を確認しています…</p></section>

  <section id="unlinked" class="card hidden">
    <h2>初回登録</h2>
    <p class="hint">参加者台帳に登録されている方のお名前を選択してください。本人確認のため、ふりがなを2文字以上入力します。</p>
    <label for="kana">ふりがな（姓または名）</label>
    <input id="kana" type="text" inputmode="kana" autocomplete="off" placeholder="例：やまだ">
    <button id="searchButton" type="button">名前を検索する</button>
    <div id="searchResult" aria-live="polite"></div>
    <p class="foot">台帳にお名前がない場合は、スタッフへお声がけください。</p>
  </section>

  <section id="checkin" class="card hidden">
    <div class="center"><div class="mark">✓</div><p class="hint">登録済みの参加者です</p><p id="participantName" class="name"></p></div>
    <button id="checkinButton" type="button">出席する</button>
    <p class="foot">同じ日に複数回押しても、出席は重複登録されません。</p>
  </section>

  <section id="complete" class="card hidden center">
    <div class="mark">✓</div><h2 id="completeTitle">出席を受け付けました</h2><p id="completeText" class="notice"></p>
  </section>

  <section id="errorBox" class="card hidden"><h2>受付できませんでした</h2><p id="errorText" class="error"></p><button id="retryButton" class="sub" type="button">もう一度試す</button></section>
</main>

<script>
'use strict';
const LIFF_ID = '2011459385-7lJkDlr6';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwayo6o_NLYXy_8BrzYnWkHywaJb4ZEHycZAwmYdpz5hD-7F3qb4R0E3PbEWAA2sE1sPQ/exec';
let idToken = '';

const $ = (id) => document.getElementById(id);
const screens = ['loading','unlinked','checkin','complete','errorBox'];
function show(id){ screens.forEach(x => $(x).classList.toggle('hidden',x !== id)); }
function setBusy(button,busy,label){ button.disabled = busy; if(busy) button.dataset.label = button.textContent; button.textContent = busy ? '処理中…' : (button.dataset.label || label); }
function fail(message){ $('errorText').textContent = message || '通信に失敗しました。電波状況を確認して、もう一度お試しください。'; show('errorBox'); }

async function api(action, extra = {}) {
  const response = await fetch(GAS_URL, {
    method: 'POST', redirect: 'follow',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, idToken, ...extra})
  });
  const text = await response.text();
  let data;
  try { data = JSON.parse(text); } catch (_) { throw new Error('サーバーから正しい応答を受け取れませんでした。'); }
  if (!response.ok || !data.ok) throw new Error(data.message || '処理に失敗しました。');
  return data;
}

async function loadStatus(){
  show('loading');
  try {
    const data = await api('status');
    if (data.status === 'linked') {
      $('participantName').textContent = data.fullName || '';
      show('checkin');
    } else {
      show('unlinked');
      $('kana').focus();
    }
  } catch (e) { fail(e.message); }
}

async function start(){
  try {
    await liff.init({liffId: LIFF_ID});
    if (!liff.isLoggedIn()) { liff.login({redirectUri: location.href}); return; }
    idToken = liff.getIDToken();
    if (!idToken) throw new Error('LINEの本人確認情報を取得できませんでした。LINEアプリ内から開き直してください。');
    await loadStatus();
  } catch (e) { fail(e.message || 'LINEの初期化に失敗しました。'); }
}

$('searchButton').addEventListener('click', async () => {
  const kana = $('kana').value.trim();
  if (kana.length < 2) { $('searchResult').innerHTML = '<p class="error">ふりがなを2文字以上入力してください。</p>'; return; }
  const button = $('searchButton'); setBusy(button,true);
  try {
    const data = await api('search',{kana});
    const items = data.candidates || [];
    if (!items.length) { $('searchResult').innerHTML = '<p class="error">該当するお名前が見つかりません。入力を確認するか、スタッフへお声がけください。</p>'; return; }
    $('searchResult').innerHTML = '<p class="hint">ご本人のお名前を選んでください。</p>' + items.map(x => `<button type="button" class="candidate" data-id="${escapeHtml(x.participantId)}"><span>${escapeHtml(x.fullName)}</span><small>${escapeHtml(x.kana || '')}</small></button>`).join('');
    document.querySelectorAll('.candidate').forEach(b => b.addEventListener('click', () => link(b.dataset.id)));
  } catch(e) { $('searchResult').innerHTML = `<p class="error">${escapeHtml(e.message)}</p>`; }
  finally { setBusy(button,false,'名前を検索する'); }
});

async function link(participantId){
  try {
    const data = await api('link',{participantId});
    $('participantName').textContent = data.fullName || '';
    show('checkin');
  } catch(e) { fail(e.message); }
}

$('checkinButton').addEventListener('click', async () => {
  const button = $('checkinButton'); setBusy(button,true);
  try {
    const data = await api('checkin');
    $('completeTitle').textContent = data.alreadyCheckedIn ? '本日はすでに出席済みです' : '出席を受け付けました';
    $('completeText').textContent = `${data.fullName || ''}さん　${data.date || ''}`;
    show('complete');
  } catch(e) { fail(e.message); }
  finally { setBusy(button,false,'出席する'); }
});
$('retryButton').addEventListener('click', start);
function escapeHtml(s){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
start();
</script>
</body>
</html>
