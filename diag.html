<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受付システム通信診断</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#f6f8fa;color:#17212b;margin:0}main{max-width:760px;margin:auto;padding:24px 16px 56px}h1{font-size:23px}h2{font-size:17px;margin-top:32px}p{line-height:1.7}.note{background:#fff7df;border-left:5px solid #d69200;padding:12px 14px}.box,pre{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:14px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}button{background:#1769aa;color:#fff;border:0;border-radius:7px;font-size:16px;font-weight:700;padding:13px 18px;margin:8px 8px 8px 0;cursor:pointer}button.sub{background:#fff;color:#1769aa;border:1px solid #1769aa}.ok{color:#147c4b}.ng{color:#b42318}.row{border-bottom:1px solid #e5e9ed;padding:10px 0}.key{display:block;color:#59636d;font-size:13px;margin-bottom:3px}input{width:100%;padding:10px;border:1px solid #b8c3cd;border-radius:6px;font-family:monospace;font-size:13px;box-sizing:border-box}</style></head><body><main><h1>受付システム通信診断</h1><p>参加者には見せない診断用ページです。個人情報は入力しません。</p><p class="note">このページでは出席登録を行いません。Apps Scriptへの <code>status</code> リクエストだけをテストします。</p><h2>設定値</h2><label>LIFF ID<input id="liffId" value="2011459385-7lJkDlr6"></label><br><label>Apps Script WebアプリURL<input id="gasUrl" value="https://script.google.com/macros/s/AKfycbwayo6o_NLYXy_8BrzYnWkHywaJb4ZEHycZAwmYdpz5hD-7F3qb4ROE3PbEWAA2sE1sPQ/exec"></label><p><button id="run">診断を実行する</button><button id="copy" class="sub">結果をコピー</button></p><h2>診断結果</h2><div id="result" class="box">未実行</div><h2>共有用テキスト</h2><pre id="report">未実行</pre></main><script>'use strict';const $=id=>document.getElementById(id);let report='未実行';function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function line(k,v,ok){return `<div class="row"><span class="key">${esc(k)}</span><span class="${ok===true?'ok':ok===false?'ng':''}">${esc(v)}</span></div>`}async function attempt(name,fn,items){try{const value=await fn();items.push([name,value,true]);return value}catch(e){items.push([name,`${e.name||'Error'}: ${e.message||String(e)}`,false]);return null}}$('run').onclick=async()=>{const liffId=$('liffId').value.trim(),url=$('gasUrl').value.trim(),items=[];$('result').textContent='診断中…';let token='';await attempt('現在のURL',async()=>location.href,items);await attempt('LIFF SDK',async()=>typeof liff==='undefined'?'SDKが読み込めません':`読み込み済み v${liff.getVersion?.()||'?'}`,items);if(typeof liff!=='undefined'){const initialized=await attempt('liff.init',async()=>{await liff.init({liffId});return '成功'},items);if(initialized){await attempt('LINE内か',async()=>String(liff.isInClient()),items);await attempt('ログイン状態',async()=>String(liff.isLoggedIn()),items);const t=await attempt('IDトークン',async()=>{const x=liff.getIDToken();if(!x)throw new Error('取得できません');return `取得成功（${x.length}文字）`},items);if(t)token=liff.getIDToken()}}await attempt('GET fetch（匿名）',async()=>{const r=await fetch(url,{method:'GET',redirect:'follow'});return `HTTP ${r.status} / ${await r.text()}`},items);await attempt('POST no-cors（到達補助確認）',async()=>{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'status',idToken:token||null})});return 'fetchは解決（応答はno-corsのため確認不能）'},items);await attempt('POST 通常（本番経路）',async()=>{const r=await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'status',idToken:token||null})});return `HTTP ${r.status} / ${await r.text()}`},items);$('result').innerHTML=items.map(x=>line(x[0],x[1],x[2])).join('');report=['受付システム通信診断 '+new Date().toLocaleString('ja-JP'),...items.map(x=>`${x[0]}: ${x[1]}`)].join('\n');$('report').textContent=report};$('copy').onclick=()=>navigator.clipboard.writeText(report).then(()=>alert('コピーしました。'));</script></body></html>
